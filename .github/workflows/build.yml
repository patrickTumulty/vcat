name: vcat-ci-pipeline

on:
  push:
    branches:
      - '**'
    tags:
      - '*'
  workflow_dispatch:

jobs:
  run-unit-tests-x86:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build devcontainer image (cached)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .devcontainer/Dockerfile
          tags: vcat-dev
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run unit tests
        run: |
          docker run --rm -v "$PWD:/workspace" -w /workspace --user 0 vcat-dev \
            bash -lc 'make test ARCH=x86 BUILD_DIR=build/test'

  build-x86:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Resolve build version
        id: meta
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="dev-${GITHUB_SHA::7}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build devcontainer image (cached)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .devcontainer/Dockerfile
          tags: vcat-dev
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build, bundle, and package tarball
        run: |
          docker run --rm -v "$PWD:/workspace" -w /workspace --user 0 vcat-dev \
            bash -lc '
              make build ARCH=x86 BUILD_TYPE=Release BUILD_DIR=build/x86 && \
              make install ARCH=x86 BUILD_DIR=build/x86 INSTALL_PREFIX=dist/vcat-linux-x86_64 && \
              mkdir -p artifacts && \
              tar -czf artifacts/vcat-linux-x86_64-${{ steps.meta.outputs.version }}.tar.gz -C dist vcat-linux-x86_64
            '

      - name: Upload x86_64 package
        uses: actions/upload-artifact@v4
        with:
          name: vcat-linux-x86_64-${{ steps.meta.outputs.version }}
          path: artifacts/vcat-linux-x86_64-${{ steps.meta.outputs.version }}.tar.gz

  build-arm64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Resolve build version
        id: meta
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="dev-${GITHUB_SHA::7}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build devcontainer image (cached)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .devcontainer/Dockerfile
          tags: vcat-dev
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build, bundle, and package tarball
        run: |
          docker run --rm -v "$PWD:/workspace" -w /workspace --user 0 vcat-dev \
            bash -lc '
              make build ARCH=arm64 BUILD_TYPE=Release BUILD_DIR=build/arm64 && \
              make install ARCH=arm64 BUILD_DIR=build/arm64 INSTALL_PREFIX=dist/vcat-linux-arm64 && \
              mkdir -p artifacts && \
              tar -czf artifacts/vcat-linux-arm64-${{ steps.meta.outputs.version }}.tar.gz -C dist vcat-linux-arm64
            '

      - name: Upload arm64 package
        uses: actions/upload-artifact@v4
        with:
          name: vcat-linux-arm64-${{ steps.meta.outputs.version }}
          path: artifacts/vcat-linux-arm64-${{ steps.meta.outputs.version }}.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [run-unit-tests-x86, build-x86, build-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          pattern: vcat-linux-*
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.tar.gz

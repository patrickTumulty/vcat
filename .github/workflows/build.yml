name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build devcontainer image (cached)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .devcontainer/Dockerfile
          tags: tplay-dev
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build native + arm64 and bundle
        run: |
          docker run --rm -v "$PWD:/workspace" -w /workspace --user 0 tplay-dev \
            bash -lc '
              make build ARCH=native BUILD_TYPE=Release BUILD_DIR=build/native && \
              make build ARCH=arm64 BUILD_TYPE=Release BUILD_DIR=build/arm64 && \
              make install ARCH=native BUILD_DIR=build/native INSTALL_PREFIX=dist/vcat-native && \
              make install ARCH=arm64 BUILD_DIR=build/arm64 INSTALL_PREFIX=dist/vcat-arm64
            '

      - name: Run unit tests
        run: |
          docker run --rm -v "$PWD:/workspace" -w /workspace --user 0 tplay-dev \
            bash -lc 'make test ARCH=native BUILD_DIR=build/test'

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vcat-linux
          path: dist/

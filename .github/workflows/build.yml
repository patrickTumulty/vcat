name: vcat-ci-pipeline

on:
  push:
    branches:
      - '**'
    tags:
      - '*'
  workflow_dispatch:

jobs:
  # Builds the devcontainer Docker image once and pushes it to GHCR. The tag
  # is a hash of the Dockerfile, so as long as the Dockerfile is unchanged the
  # already pushed image is reused and this job finishes in seconds. All other
  # jobs pull this image instead of building it themselves.
  #
  # The image is additionally tagged devcontainer:v<VERSION>, where <VERSION>
  # is the org.opencontainers.image.version label in the Dockerfile, which is
  # what devcontainer.json pins. Bumping the version label is the human-facing
  # signal that a Dockerfile change needs to reach developer machines.
  build-devcontainer:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
      version_tag: ${{ steps.meta.outputs.version_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve devcontainer image reference
        id: meta
        shell: bash
        run: |
          # The Dockerfile has no COPY/ADD instructions, so its content alone
          # determines the image. Hashing it gives a stable, content-addressed
          # tag: unchanged Dockerfile -> same tag -> image already in GHCR.
          HASH=$(sha256sum .devcontainer/Dockerfile | cut -d' ' -f1 | cut -c1-12)
          # The human-facing version tag comes from the image label.
          VERSION=$(grep -oP '(?<=org\.opencontainers\.image\.version=")[^"]+' .devcontainer/Dockerfile)
          if [ -z "$VERSION" ]; then
            echo "::error::.devcontainer/Dockerfile is missing a 'LABEL org.opencontainers.image.version=\"...\"'"
            exit 1
          fi
          REPO="${GITHUB_REPOSITORY,,}"
          echo "hash_tag=ghcr.io/${REPO}/devcontainer:${HASH}" >> "$GITHUB_OUTPUT"
          echo "version_tag=ghcr.io/${REPO}/devcontainer:v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${REPO}/devcontainer:${HASH}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if image already exists in GHCR
        id: check
        shell: bash
        run: |
          if docker buildx imagetools inspect "${{ steps.meta.outputs.hash_tag }}" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # The hash tag already existing means the Dockerfile changed at some
      # point since the image answers to a new content address. If the version
      # label was not bumped along with that change, the developer-facing
      # version tag would silently start pointing at a different image, so
      # fail the run instead and ask for the bump.
      - name: Verify Dockerfile version was bumped
        if: steps.check.outputs.exists == 'true'
        shell: bash
        run: |
          VERSION=$(grep -oP '(?<=org\.opencontainers\.image\.version=")[^"]+' .devcontainer/Dockerfile)
          docker pull -q "${{ steps.meta.outputs.hash_tag }}"
          STORED=$(docker image inspect \
            --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' \
            "${{ steps.meta.outputs.hash_tag }}")
          if [ "$STORED" != "$VERSION" ]; then
            echo "::error::The devcontainer Dockerfile changed but 'org.opencontainers.image.version' stayed at $STORED. Bump the version label so the new image is reachable as devcontainer:v$VERSION."
            exit 1
          fi

      # Cache hit: the image itself is already in GHCR, so alias the version
      # tag to the same manifest instead of rebuilding anything.
      - name: Tag cached image with version
        if: steps.check.outputs.exists == 'true'
        shell: bash
        run: |
          docker buildx imagetools create \
            -t "${{ steps.meta.outputs.version_tag }}" \
            "${{ steps.meta.outputs.hash_tag }}"

      - name: Build and push devcontainer image
        if: steps.check.outputs.exists != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .devcontainer/Dockerfile
          tags: |
            ${{ steps.meta.outputs.hash_tag }}
            ${{ steps.meta.outputs.version_tag }}
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  run-unit-tests-x86:
    needs: [build-devcontainer, build-x86]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: build-x86
          path: artifacts/

      - name: Extract build directory
        run: |
          mkdir -p build
          tar -xzf artifacts/build-x86.tar.gz -C build

      # Same image-cache scheme as build-x86; see that job for rationale.
      - name: Cache devcontainer image
        id: devcontainer-cache
        uses: actions/cache@v4
        with:
          path: /tmp/.devcontainer-cache
          key: devcontainer-${{ needs.build-devcontainer.outputs.image }}
          restore-keys: |
            devcontainer-

      - name: Pull and archive image
        if: steps.devcontainer-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker pull -q "${{ needs.build-devcontainer.outputs.image }}"
          mkdir -p /tmp/.devcontainer-cache
          docker save "${{ needs.build-devcontainer.outputs.image }}" -o /tmp/.devcontainer-cache/image.tar

      - name: Load cached image
        if: steps.devcontainer-cache.outputs.cache-hit == 'true'
        shell: bash
        run: docker load -i /tmp/.devcontainer-cache/image.tar

      - name: Run unit tests
        run: |
          docker run --rm --user root \
            -v ${{ github.workspace }}:${{ github.workspace }} \
            -w ${{ github.workspace }} \
            "${{ needs.build-devcontainer.outputs.image }}" \
            ctest --test-dir build/x86 --output-on-failure

  build-x86:
    needs: build-devcontainer
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          # git describe needs the full history and the tags; the default
          # shallow, tag-less checkout would always fall back to a bare hash.
          fetch-depth: 0

      # The native `container:` keyword cold-pulls the image from GHCR on
      # every run (~2 min on a clean runner). Instead, cache the image as a
      # tarball on the actions cache backend, which lives in the same
      # datacenter as the runner: restoring + `docker load` takes seconds.
      # The key embeds the content-addressed image hash from
      # build-devcontainer, so a Dockerfile change simply becomes a new
      # cache entry.
      - name: Cache devcontainer image
        id: devcontainer-cache
        uses: actions/cache@v4
        with:
          path: /tmp/.devcontainer-cache
          key: devcontainer-${{ needs.build-devcontainer.outputs.image }}
          restore-keys: |
            devcontainer-

      # Cache miss (or 7-day eviction): pull from GHCR once and mirror the
      # image into the cache path so later runs skip the registry entirely.
      - name: Pull and archive image
        if: steps.devcontainer-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker pull -q "${{ needs.build-devcontainer.outputs.image }}"
          mkdir -p /tmp/.devcontainer-cache
          docker save "${{ needs.build-devcontainer.outputs.image }}" -o /tmp/.devcontainer-cache/image.tar

      # Cache hit: load the image straight from the runner disk.
      - name: Load cached image
        if: steps.devcontainer-cache.outputs.cache-hit == 'true'
        shell: bash
        run: docker load -i /tmp/.devcontainer-cache/image.tar

      - name: Resolve build version
        id: meta
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          VERSION=$(git describe --tags --always | tr '/' '-')
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      # Execute the build inside the container via explicit docker run.
      # The workspace bind-mount keeps artifacts on the host for the
      # packaging/upload steps that follow.
      - name: Build, bundle, and package tarball
        run: |
          docker run --rm --user root \
            -v ${{ github.workspace }}:${{ github.workspace }} \
            -w ${{ github.workspace }} \
            "${{ needs.build-devcontainer.outputs.image }}" \
            bash -c "make nuke && make build BUILD_DIR=build/x86 BUILD_TYPE=Release && make bundle BUILD_DIR=build/x86"

      - name: Archive build directory
        run: |
          mkdir -p artifacts
          tar -czf artifacts/build-x86.tar.gz -C build x86

      - name: Upload build directory
        uses: actions/upload-artifact@v4
        with:
          name: build-x86
          path: artifacts/build-x86.tar.gz

      - name: Upload x86_64 package
        uses: actions/upload-artifact@v4
        with:
          name: vcat-linux-x86_64-${{ steps.meta.outputs.version }}
          path: artifacts/vcat-linux-x86_64-${{ steps.meta.outputs.version }}.tar.gz
          if-no-files-found: error

  build-arm64:
    needs: build-devcontainer
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          # git describe needs the full history and the tags; the default
          # shallow, tag-less checkout would always fall back to a bare hash.
          fetch-depth: 0

      # Same image-cache scheme as build-x86; see that job for rationale.
      - name: Cache devcontainer image
        id: devcontainer-cache
        uses: actions/cache@v4
        with:
          path: /tmp/.devcontainer-cache
          key: devcontainer-${{ needs.build-devcontainer.outputs.image }}
          restore-keys: |
            devcontainer-

      - name: Pull and archive image
        if: steps.devcontainer-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker pull -q "${{ needs.build-devcontainer.outputs.image }}"
          mkdir -p /tmp/.devcontainer-cache
          docker save "${{ needs.build-devcontainer.outputs.image }}" -o /tmp/.devcontainer-cache/image.tar

      - name: Load cached image
        if: steps.devcontainer-cache.outputs.cache-hit == 'true'
        shell: bash
        run: docker load -i /tmp/.devcontainer-cache/image.tar

      - name: Resolve build version
        id: meta
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          VERSION=$(git describe --tags --always | tr '/' '-')
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build, bundle, and package tarball
        run: |
          docker run --rm --user root \
            -v ${{ github.workspace }}:${{ github.workspace }} \
            -w ${{ github.workspace }} \
            "${{ needs.build-devcontainer.outputs.image }}" \
            bash -c "make nuke && make build ARCH=arm64 BUILD_DIR=build/arm64 BUILD_TYPE=Release && make bundle ARCH=arm64 BUILD_DIR=build/arm64"

      - name: Upload arm64 package
        uses: actions/upload-artifact@v4
        with:
          name: vcat-linux-arm64-${{ steps.meta.outputs.version }}
          path: artifacts/vcat-linux-arm64-${{ steps.meta.outputs.version }}.tar.gz
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-x86, run-unit-tests-x86, build-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          pattern: vcat-linux-*
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.tar.gz
          generate_release_notes: true
          fail_on_unmatched_files: true

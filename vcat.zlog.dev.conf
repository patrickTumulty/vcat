# zlog configuration for vcat.
#
# Sits next to the vcat executable: the bundle copies it into bin/ beside the
# binary (see scripts/bundle.sh), and vcatLogInit() resolves it from the
# executable's directory, the working directory, or ZLOG_CONF_PATH.
#
# The TUI owns the terminal, so there is deliberately no console rule. The log
# file path goes through %E(VCAT_LOG_DIR) so installed bundles redirect it
# (the launcher exports the XDG state dir); vcatLogInit() defaults the
# variable to "." for development runs, hence <cwd>/log. Rotation: 5 MB per
# file, four archives on top, as the old rotating sink kept.
[formats]
vcat = "%d(%Y-%m-%d %H:%M:%S).%ms [%-5V](%t)[%25.25f:%-4L] %m%n"

[rules]
vcat.DEBUG "%E(VCAT_LOG_DIR)/vcat.log", 5M * 4; vcat
